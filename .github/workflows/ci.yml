name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Test & Evaluation Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality (Ruff Lint)
        run: |
          ruff check src/ tests/ eval/

      - name: Ingest Raw Documents (Offline Chroma + BM25)
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          ENABLE_RERANKER: "false"
        run: |
          python -m src.ingestion.ingest_pipeline --rebuild

      - name: Run Unit & Integration Tests (Pytest)
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          ENABLE_RERANKER: "false"
        run: |
          pytest tests/ -v

      - name: Run Evaluation Benchmark (30 Questions)
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          ENABLE_RERANKER: "false"
        run: |
          python -m eval.run --mock
